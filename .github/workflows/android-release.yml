name: Build and release Android
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mathquest-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci && npm test
      - name: Read version and skip existing release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          name=$(sed -n 's/^versionName=//p' version.properties)
          code=$(sed -n 's/^versionCode=//p' version.properties)
          [[ "$name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] && [[ "$code" =~ ^[1-9][0-9]*$ ]]
          echo "tag=v$name" >> "$GITHUB_OUTPUT"
          if gh release view "v$name" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; fi
      - name: Restore signing key
        if: steps.version.outputs.exists != 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.MQ_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Add MQ_KEYSTORE_BASE64, MQ_STORE_PASSWORD and MQ_KEY_PASSWORD repository secrets first.'; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mathquest.jks"
      - name: Build and lint signed APK
        if: steps.version.outputs.exists != 'true'
        env:
          MQ_KEYSTORE: ${{ runner.temp }}/mathquest.jks
          MQ_STORE_PASSWORD: ${{ secrets.MQ_STORE_PASSWORD }}
          MQ_KEY_PASSWORD: ${{ secrets.MQ_KEY_PASSWORD }}
        run: gradle assembleGithubRelease bundlePlayRelease lintGithubRelease lintPlayRelease --console=plain
      - name: Check distribution boundaries
        if: steps.version.outputs.exists != 'true'
        run: python3 scripts/check-distributions.py
      - name: Prepare verified release
        if: steps.version.outputs.exists != 'true'
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p release
          cp app/build/outputs/apk/github/release/app-github-release.apk release/MathQuest.apk
          python3 scripts/make_manifest.py
      - uses: actions/upload-artifact@v4
        if: steps.version.outputs.exists != 'true'
        with:
          name: MathQuest-signed-release
          path: release/
      - uses: actions/upload-artifact@v4
        if: steps.version.outputs.exists != 'true'
        with:
          name: MathQuest-Play-candidate-not-for-submission
          path: app/build/outputs/bundle/playRelease/*.aab
      - name: Publish release
        if: steps.version.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" release/MathQuest.apk release/update.json release/MathQuest.apk.sha256 --title "Math Quest $TAG" --notes-file CHANGELOG.md --latest
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/mathquest.jks"
