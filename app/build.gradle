plugins { id 'com.android.application'; id 'com.google.gms.google-services' }
def appVersion = new Properties()
rootProject.file('version.properties').withInputStream { appVersion.load(it) }
android {
    namespace 'com.cpaul.mathquest'
    compileSdk 36
    defaultConfig {
        applicationId 'com.cpaul.mathquest'
        minSdk 26
        targetSdk 36
        versionCode appVersion.getProperty('versionCode').toInteger()
        versionName appVersion.getProperty('versionName')
        buildConfigField 'String', 'UPDATE_REPO', '"cpaul1988/MathQuest"'
    }
    flavorDimensions "distribution"
    productFlavors {
        github { dimension "distribution" }
        play { dimension "distribution" }
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        release {
            if (System.getenv('MQ_KEYSTORE')) {
                storeFile file(System.getenv('MQ_KEYSTORE'))
                storePassword System.getenv('MQ_STORE_PASSWORD')
                keyAlias 'mathquest'
                keyPassword System.getenv('MQ_KEY_PASSWORD')
            }
        }
    }
    buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation platform('com.google.firebase:firebase-bom:34.19.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.core:core:1.15.0'
}
